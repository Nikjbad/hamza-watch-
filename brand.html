<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0e1a;--blue:#1a73e8;--gold:#c9a961;--paper:#f5f7fb;--slate:#5c6779;--line:#dfe4ed}*{box-sizing:border-box;margin:0}body{font-family:Inter,sans-serif;background:var(--paper);color:#0b1220;line-height:1.5}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0}.wrap{max-width:1180px;margin:auto;padding:0 24px}.top{background:var(--ink);color:#fff;font:12px JetBrains Mono;padding:9px;text-align:center;letter-spacing:.05em}.nav{background:var(--ink);color:#fff;position:sticky;top:0;z-index:4}.navin{max-width:1180px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font:700 23px Fraunces}.logo i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px #5b9dff;margin-right:8px}.links{display:flex;gap:25px;font-size:14px;color:#cbd1de}.links a:hover{color:#fff}.cart{background:var(--blue);border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700}.hero{background:linear-gradient(120deg,#0a0e1a,#1a3150);color:#fff;padding:78px 0}.eyebrow{font:700 11px JetBrains Mono;color:#79b4ff;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}.hero h1,h2,h3{font-family:Fraunces,serif}.hero h1{font-size:clamp(44px,7vw,76px);line-height:1;margin-bottom:18px}.hero p{color:#b8c2d4;max-width:560px;font-size:16px}.hero small{display:block;color:var(--gold);font:700 11px JetBrains Mono;letter-spacing:.12em;margin-top:28px;text-transform:uppercase}.section{padding:74px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:30px}.head h2{font-size:40px}.head p{color:var(--slate);max-width:420px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:0 18px 42px #0a0e1a22}.media{height:210px;border-radius:9px;background:linear-gradient(145deg,#172039,#080c17);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:15px}.media img{width:100%;height:100%;object-fit:contain;padding:12px;filter:drop-shadow(0 14px 15px #0008)}.tag{font:700 10px JetBrains Mono;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}.card h3{font-size:21px;margin:6px 0}.desc{font-size:12.5px;color:var(--slate);min-height:39px}.price{display:flex;gap:8px;align-items:baseline;margin:13px 0}.price strong{font-size:19px}.price del{font-size:12px;color:#8993a6}.card button{width:100%;padding:11px;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:13px}.back{display:inline-block;margin-top:28px;color:var(--blue);font-weight:700;font-size:14px}footer{background:#070a12;color:#aeb8ca;padding:42px 0;font-size:13px}.foot{display:flex;justify-content:space-between;gap:20px}.foot strong{color:#fff;font:700 22px Fraunces}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.links{display:none}.navin{padding:13px 16px}.wrap{padding:0 16px}.grid{grid-template-columns:1fr}.hero{padding:60px 0}.head{display:block}.head h2{font-size:35px;margin-bottom:10px}.foot{display:block}.foot span{display:block;margin-top:10px}}
</style>
</head>
<body>
<div class="top">FREE PAN-INDIA SHIPPING · COD AVAILABLE · 2-YEAR WARRANTY</div>
<header class="nav"><div class="navin"><a class="logo" href="index.html"><i></i>HAMZA</a><nav class="links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">Our Story</a><a href="contact.html">Contact</a></nav><a class="cart" href="index.html#cart">Cart <span id="cartCount">0</span></a></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">HAMZA watch line</div><h1 id="brandTitle">Explore the line.</h1><p id="brandIntro"></p><small id="brandNote"></small></div></section>
<section class="section"><div class="wrap"><div class="head"><div><div class="eyebrow">The collection</div><h2>Made for this kind of day.</h2></div><p id="brandSummary"></p></div><div class="grid" id="productGrid"></div><a class="back" href="shop.html">← Back to all watches</a></div></section>
<footer><div class="wrap foot"><strong>HAMZA</strong><span>Precision timepieces, ordered direct.</span><a href="shop.html">All watches</a><a href="contact.html">Support</a></div></footer>
<script>
const lines={
  'Hamza Marine':{title:'Marine',intro:'Tool watches for open water, long weekends and every place the map turns blue.',note:'200m-ready · automatic movements',summary:'The Marine line pairs dive-rated capability with a case you can wear long after you leave the water.'},
  'Hamza Chrono':{title:'Chrono',intro:'Measured, precise and kinetic. Built for people who like to know exactly when.',note:'Chronograph movements · racing details',summary:'The Chrono line brings timing functionality into crisp, highly legible silhouettes.'},
  'Hamza Heritage':{title:'Heritage',intro:'Quiet proportions and considered details for the hours that ask you to slow down.',note:'Slim cases · enduring materials',summary:'The Heritage line is our answer to dress watches that feel personal rather than precious.'},
  'Hamza Field':{title:'Field',intro:'Legible, resilient companions for trails, travel and the daily route between them.',note:'High-legibility · all-day comfort',summary:'The Field line keeps the essentials visible and the case ready for the unexpected.'}
};
const products=[
['Neptune Abyss','Diver','Hamza Marine',4299,7999,'imag1.jpeg','200m water resistance and a luminous, unidirectional bezel.'],['Pulse Chronos','Chronograph','Hamza Chrono',5499,9499,'imag2.jpeg','A sharp tri-compax dial with timing precision.'],['Elegance Crown','Classic','Hamza Heritage',3799,6299,'imag3.jpeg','Slim proportions, domed crystal and a warm bezel.'],['Shadow Trail','Field','Hamza Field',3299,5499,'imag4.jpeg','A matte, high-contrast companion for daily knocks.'],['Horizon Pro','Field','Hamza Field',4899,8299,'imag5.jpeg','Cockpit-inspired legibility and easy adjustment.'],['Velocity RS','Chronograph','Hamza Chrono',5999,10499,'imag6.jpeg','Racing-red accents and a sapphire-coated crystal.'],['Blossom Rose','Classic','Hamza Heritage',3999,6799,'imag7.jpeg','Rose-tone case and a soft blush dial.'],['Cosmos Skeleton','Diver','Hamza Marine',6499,11999,'imag8.jpeg','An open-worked dial exposing the movement beneath.'],['Blue Horizon','Diver','Hamza Marine',5799,9999,'imag9.jpeg','A travel-ready GMT hand and ocean-blue dial.'],['Midnight Noir','Classic','Hamza Heritage',3599,5999,'imag10.jpeg','Minimal black dial and a slim case.'],['Sprint Chrono','Chronograph','Hamza Chrono',4699,7999,'imag11.jpeg','A compact racing chronograph with a clean layout.'],['Explorer Trail','Field','Hamza Field',2899,4999,'imag12.jpeg','Lightweight and built around a readable dial.']];
const brand=new URLSearchParams(location.search).get('brand')||'Hamza Marine';const line=lines[brand]||lines['Hamza Marine'];document.title=line.title+' — HAMZA Watches';document.getElementById('brandTitle').textContent=line.title;document.getElementById('brandIntro').textContent=line.intro;document.getElementById('brandNote').textContent=line.note;document.getElementById('brandSummary').textContent=line.summary;
const grid=document.getElementById('productGrid');const list=products.filter(p=>p[2]===brand);grid.innerHTML=list.map((p,i)=>`<article class="card"><div class="media"><img src="${p[5]}" alt="${p[0]} watch" loading="lazy"></div><span class="tag">${p[1]} · ${brand}</span><h3>${p[0]}</h3><p class="desc">${p[6]}</p><div class="price"><strong>₹${p[3].toLocaleString('en-IN')}</strong><del>₹${p[4].toLocaleString('en-IN')}</del></div><button onclick="add(${i})">Add to cart</button></article>`).join('');
function add(index){const source=products.filter(p=>p[2]===brand);const cart=JSON.parse(localStorage.getItem('hamza_cart')||'{}');cart['p'+(products.indexOf(source[index])+1)]=(cart['p'+(products.indexOf(source[index])+1)]||0)+1;localStorage.setItem('hamza_cart',JSON.stringify(cart));updateCount();alert(source[index][0]+' added to your selection.')}function updateCount(){const cart=JSON.parse(localStorage.getItem('hamza_cart')||'{}');document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}updateCount();
</script>
</body>
</html>
